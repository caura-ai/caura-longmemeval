[project]
name = "caura-longmemeval"
version = "0.1.0"
description = "LongMemEval benchmark harness for Caura.ai memory platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "google-genai>=1.66.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
longmemeval = "longmemeval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longmemeval"]
